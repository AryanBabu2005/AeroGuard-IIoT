services:
  api:
    build: .
    container_name: aeroguard-api
    ports:
      - "8000:8000"
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  dashboard:
    build: .
    container_name: aeroguard-dashboard
    ports:
      - "8501:8501"
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    environment:
      # Points the dashboard to the internal Docker network name 'api'
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped